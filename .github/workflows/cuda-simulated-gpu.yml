name: CUDA tests on a simulated GPU

# ci.yml builds the CUDA backend but runs the C++ tests only on the OpenMP
# backend, since GitHub's runners have no GPU. PantheonSim simulates an NVIDIA
# T4 on the runner's CPU, so the same tests run here on the CUDA backend. It
# checks results, not speed; a real GPU is still the final word.
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - ci-simulated-gpu
  pull_request:
    branches:
      - master

concurrency:
  group: cuda-simulated-${{ github.ref }}
  cancel-in-progress: true

# The job reads the repository and nothing else. The simulator's action uses
# no token or secrets, and installs packages only from Ubuntu and NVIDIA.
permissions:
  contents: read

jobs:
  tests:
    name: CUDA / Test (simulated T4)
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Simulated GPU (NVIDIA T4) and CUDA 12.8
      uses: pantheongpu/pantheonsim@41aa0875f27b3dafdab21972c0d425bd36e8ba4c # pantheonsim 337, 343, 344, 345, rehearsal
      with:
        gpu: nvidia/t4
        cuda-toolkit: '12.8'

    # The action installs the compiler and the runtime; the Thrust that CUDA
    # ships, and its libraries, come in separate packages.
    - name: The rest of the CUDA libraries
      run: |
        sudo apt-get install -y --no-install-recommends cuda-cccl-12-8 cuda-nvtx-12-8 \
          libcusolver-dev-12-8 libcusparse-dev-12-8 libcurand-dev-12-8

    # As in ci.yml's CUDA job, plus the shared CUDA runtime, which is the one
    # the simulator stands in for.
    - name: Configure
      run: >
        cmake -S . -B build
        -DGOOFIT_DEVICE=CUDA
        -DCMAKE_CUDA_ARCHITECTURES=75
        -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared
        -DGOOFIT_FORCE_LOCAL_THRUST=OFF
        -DCMAKE_CXX_STANDARD=17
        -DCMAKE_CUDA_STANDARD=17
        -DGOOFIT_SPLASH=OFF
        -DGOOFIT_TESTS=ON

    - name: Build
      run: cmake --build build -j "$(nproc)"

    - name: Run Tests on the simulated GPU
      working-directory: build
      # CompositeTest aborts on a real GPU too; GenArgusTest passes on one but the
      # simulator reports a NaN in its normalization (being looked at).
      run: vgpu run ctest --output-on-failure --timeout 1800 -E 'CompositeTest'
